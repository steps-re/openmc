# Temporary, steps-re fork only: size the #4222 effect before and after the fix, and
# regenerate regression reference results for the fix. Never part of the upstream PR.
name: steps photoelectron check
on:
  push:
    branches: [steps-ci-photoelectron]
env:
  HDF5_ROOT: /usr
  OMP_NUM_THREADS: 2
jobs:
  run:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        ref: [upstream-base, fix]
    steps:
      - uses: jwlawson/actions-setup-cmake@v2
        with: {cmake-version: '3.31'}
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: pick source
        run: |
          cp -r steps-ci /tmp/steps-ci
          if [ "${{ matrix.ref }}" = "upstream-base" ]; then git checkout -q origin/fix/photoelectron-direction~1; else git checkout -q origin/fix/photoelectron-direction; fi
          git log --oneline -1
          echo "OPENMC_CROSS_SECTIONS=$HOME/nndc_hdf5/cross_sections.xml" >> $GITHUB_ENV
          echo "OPENMC_ENDF_DATA=$HOME/endf-b-vii.1" >> $GITHUB_ENV
          echo "$HOME/NJOY2016/build" >> $GITHUB_PATH
      - name: apt
        run: |
          sudo apt -y update
          sudo apt install -y libpng-dev libnetcdf-dev libpnetcdf-dev libhdf5-serial-dev libeigen3-dev
      - name: install
        env: {MPI: n, PHDF5: n, OMP: n, DAGMC: n, XDG: n, EVENT: n, LIBMESH: n}
        run: $GITHUB_WORKSPACE/tools/ci/gha-install.sh
      - uses: actions/cache@v5
        with:
          path: |
            ~/nndc_hdf5
            ~/endf-b-vii.1
          key: ${{ runner.os }}-build-xs-cache-${{ hashFiles('tools/ci/download-xs.sh') }}
      - name: before
        run: $GITHUB_WORKSPACE/tools/ci/gha-before-script.sh
      - name: calibrate
        run: |
          for pb in "20000 10" "50000 20" "100000 40"; do python /tmp/steps-ci/calibrate2.py $pb; done 2>&1 | tee calibrate.txt
      - name: which regression tests fail (no update)
        run: |
          mkdir -p out
          pytest -q -p no:cacheprovider tests/regression_tests -rf 2>&1 | tee out/pytest.txt | tail -40 || true
          grep -E '^FAILED' out/pytest.txt | sed 's/^FAILED //; s/ - .*//' | sort -u > out/failed.txt || true
          cat out/failed.txt
      - name: regenerate only the failing tests (fix only)
        if: matrix.ref == 'fix'
        run: |
          git checkout -- tests
          if [ -s out/failed.txt ]; then xargs -a out/failed.txt pytest -q -p no:cacheprovider --update 2>&1 | tail -20 || true; fi
          git status --porcelain tests | tee out/changed.txt
          git diff -- tests > out/results.diff
      - uses: actions/upload-artifact@v4
        with:
          name: steps-${{ matrix.ref }}
          path: |
            calibrate.txt
            out/
