# Temporary, steps-re fork only: size the #4222 effect before and after the fix, and
# regenerate regression reference results for the fix. Never part of the upstream PR.
name: steps photoelectron check
on:
  push:
    branches: [steps-ci-photoelectron]
env:
  HDF5_ROOT: /usr
  OMP_NUM_THREADS: 2
jobs:
  run:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        ref: [upstream-base, fix]
    steps:
      - uses: jwlawson/actions-setup-cmake@v2
        with: {cmake-version: '3.31'}
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: pick source
        run: |
          cp -r steps-ci /tmp/steps-ci
          if [ "${{ matrix.ref }}" = "upstream-base" ]; then git checkout -q origin/fix/photoelectron-direction~1; else git checkout -q origin/fix/photoelectron-direction; fi
          git log --oneline -1
          echo "OPENMC_CROSS_SECTIONS=$HOME/nndc_hdf5/cross_sections.xml" >> $GITHUB_ENV
          echo "OPENMC_ENDF_DATA=$HOME/endf-b-vii.1" >> $GITHUB_ENV
          echo "$HOME/NJOY2016/build" >> $GITHUB_PATH
      - name: apt
        run: |
          sudo apt -y update
          sudo apt install -y libpng-dev libnetcdf-dev libpnetcdf-dev libhdf5-serial-dev libeigen3-dev
      - name: install
        env: {MPI: n, PHDF5: n, OMP: n, DAGMC: n, XDG: n, EVENT: n, LIBMESH: n}
        run: $GITHUB_WORKSPACE/tools/ci/gha-install.sh
      - uses: actions/cache@v5
        with:
          path: |
            ~/nndc_hdf5
            ~/endf-b-vii.1
          key: ${{ runner.os }}-build-xs-cache-${{ hashFiles('tools/ci/download-xs.sh') }}
      - name: before
        run: $GITHUB_WORKSPACE/tools/ci/gha-before-script.sh
      - name: new unit test (must FAIL on base, PASS on fix)
        run: |
          git show origin/fix/photoelectron-direction:tests/unit_tests/test_photoelectron_direction.py > tests/unit_tests/test_photoelectron_direction.py
          sed -i 's/^    assert abs/    print("RATIO", plus_x \/ minus_x, flux, tally.std_dev.ravel(), model.settings.photon_transport, model.settings.electron_treatment); assert abs/' tests/unit_tests/test_photoelectron_direction.py
          grep -n RATIO tests/unit_tests/test_photoelectron_direction.py
          python /tmp/steps-ci/calibrate3.py 20000 5 2>&1 | tail -2 | tee -a calibrate.txt
          pytest -q -s -p no:cacheprovider tests/unit_tests/test_photoelectron_direction.py 2>&1 | tee -a calibrate.txt || true
      - name: regression tests that changed (fix only, must pass)
        if: matrix.ref == 'fix'
        run: |
          pytest -q -p no:cacheprovider tests/regression_tests/mgxs_photon tests/regression_tests/weightwindows 2>&1 | tail -5 | tee -a calibrate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: steps-${{ matrix.ref }}
          path: calibrate.txt
